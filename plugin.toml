[plugin]
name = "猫娘每日关怀"
description = "早安摸鱼日报 + 今日运势签 + 喝水提醒，相近的定时关怀集成在一个插件里，每个功能独立开关喵～运势按日期确定性生成（同一天结果不变），日报带星期/周末倒计时/发薪日倒计时，喝水提醒可在工作时段按间隔推送。所有文案都是猫娘口吻，主动推送走 push_message 让猫娘自己开口。"
short_description = "Daily catgirl care: morning fish-slacking report, daily fortune slip, and water reminders — each with its own switch."
keywords = ["运势", "fortune", "摸鱼", "日报", "早安", "morning", "喝水", "water", "提醒", "reminder", "关怀", "care", "猫娘", "neko", "每日", "daily"]
version = "0.3.3"
type = "plugin"
id = "neko_daily_fortune"
entry = "plugin.plugins.neko_daily_fortune:DailyFortunePlugin"

[plugin.author]
name = "MENGYAOYUE"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[neko_daily_fortune]
# 主人称呼与猫娘名字（文案里用）
master_name = "主人"
catgirl_name = "猫娘"
# 时区（影响"今天"的判定）
timezone = "Asia/Shanghai"
# 早安摸鱼日报推送时间（HH:MM），到点后启动也会补推
push_time = "08:30"
# 发薪日（1-31，0 表示不显示发薪日倒计时）
payday = 0
# 喝水提醒：生效时段与间隔（分钟，最小 10）
water_start = "09:00"
water_end = "21:00"
water_interval_minutes = 60
# 运势配图来源：auto = 图站猫娘插画→本地卡面轮换；local = 只用本地卡面；off = 只用固定立绘
fortune_art_source = "auto"
# 随机涩图/美图（全年龄向）开关：平台页点「换一张」可无限刷新
art_enabled = true
# 今日热点（60s 新闻）开关
news_enabled = true

[neko_daily_fortune.switches]
# 早安摸鱼日报开关
morning_push = true
# 喝水提醒开关
water_reminder = false
